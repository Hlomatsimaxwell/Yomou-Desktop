name: Linux packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Override package version (defaults to pubspec.yaml)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build:
    name: Linux packages
    # 22.04 keeps the glibc floor low enough for Debian 12 / Ubuntu 22.04+.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version:[[:space:]]*\([0-9][^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev rpm patchelf imagemagick desktop-file-utils

      - name: Build Linux release
        run: |
          flutter pub get
          flutter build linux --release

      - name: Normalise RPATHs
        run: |
          while IFS= read -r -d '' f; do
            file "$f" | grep -q ELF || continue
            readelf -d "$f" | grep -q RUNPATH || continue
            case "$(basename "$f")" in
              manga_reader) rpath='$ORIGIN/lib' ;;
              *)            rpath='$ORIGIN' ;;
            esac
            patchelf --set-rpath "$rpath" "$f"
          done < <(find build/linux/x64/release/bundle -type f \
            \( -name '*.so*' -o -perm -u+x \) -print0)

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./linux/package.sh tarball deb rpm appimage

      # One artifact per format. The run page always serves artifacts as zips,
      # but each of these contains exactly one file. Tag pushes also attach the
      # raw files to the GitHub Release (see the release job).
      - uses: actions/upload-artifact@v4
        with:
          name: yomou-tarball-${{ steps.version.outputs.version }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: yomou-deb-${{ steps.version.outputs.version }}
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: yomou-rpm-${{ steps.version.outputs.version }}
          path: dist/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: yomou-appimage-${{ steps.version.outputs.version }}
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
